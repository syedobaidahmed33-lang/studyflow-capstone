{% extends 'studyflow/layout.html' %}
{% block title %}Login | StudyFlow{% endblock %}
{% block content %}
<section class="form-card">
    <h1>Log in to StudyFlow</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button primary" type="submit">Login</button>
    </form>
    <p>Need an account? <a href="{% url 'register' %}">Register here</a>.</p>
</section>
{% endblock %}
